version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: velox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velox_password}
      POSTGRES_DB: ${POSTGRES_DB:-velox_trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velox-network

  # TimescaleDB for time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: velox-timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-velox}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-velox_password}
      POSTGRES_DB: ${TIMESCALE_DB:-velox_timeseries}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-velox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velox-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: velox-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-velox_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velox-network

  # Kafka & Zookeeper for message streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: velox-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - velox-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: velox-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - velox-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: velox-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - velox-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: velox-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - velox-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: velox-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velox}:${POSTGRES_PASSWORD:-velox_password}@postgres:5432/${POSTGRES_DB:-velox_trading}
      TIMESCALE_URL: postgresql://${TIMESCALE_USER:-velox}:${TIMESCALE_PASSWORD:-velox_password}@timescaledb:5432/${TIMESCALE_DB:-velox_timeseries}
      REDIS_URL: redis://:${REDIS_PASSWORD:-velox_redis}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - timescaledb
      - redis
      - kafka
    volumes:
      - ../backend:/app
    networks:
      - velox-network

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: velox-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - velox-network

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  velox-network:
    driver: bridge
